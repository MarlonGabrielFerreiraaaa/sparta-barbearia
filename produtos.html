<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos Sparta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-dark text-white">
    <header class="p-3 border-bottom border-warning">
      <div class="container d-flex justify-content-between align-items-center">
        <h2 class="h4 m-0 text-warning">SPARTA</h2>
        <nav>
          <a href="index.html" class="text-white text-decoration-none">Home</a>
        </nav>
      </div>
    </header>

    <main class="container py-5">
      <h1 class="text-center mb-5 fw-bold">Arsenal de Cuidados</h1>
      <div class="row row-cols-1 row-cols-md-2 g-4 mb-5">
        <div class="col text-center">
          <img
            src="https://images.unsplash.com/photo-1590159763121-7c9fd312190d?q=80&w=400"
            class="img-fluid rounded mb-2 shadow"
            alt="Pomada"
          />
          <h5 class="text-warning">Pomada Forte Sparta</h5>
          <p class="m-0">Fixação extrema para o dia a dia.</p>
          <span class="badge bg-warning text-dark">R$ 45,00</span>
        </div>
        <div class="col text-center">
          <img
            src="https://images.unsplash.com/photo-1626285861696-9f0bf5a49c6d?q=80&w=400"
            class="img-fluid rounded mb-2 shadow"
            alt="Óleo"
          />
          <h5 class="text-warning">Óleo de Barba Elite</h5>
          <p class="m-0">Hidratação profunda e brilho.</p>
          <span class="badge bg-warning text-dark">R$ 55,00</span>
        </div>
      </div>

      <section
        class="max-width-600 mx-auto bg-black p-4 rounded border border-secondary shadow"
      >
        <h3 class="text-center text-warning mb-3">Reserve seu Produto</h3>
        <form action="#" method="POST" class="row g-3">
          <div class="col-md-8">
            <input
              type="text"
              name="nome_reserva"
              class="form-control"
              placeholder="Seu Nome"
              required
            />
          </div>
          <div class="col-md-4">
            <input
              type="number"
              name="quantidade"
              class="form-control"
              placeholder="Qtd"
              min="1"
              required
            />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-warning w-100 fw-bold">
              RESERVAR AGORA
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="bg-black py-4 text-center border-top border-secondary">
      <p class="text-muted small m-0">
        &copy; 2026 Sparta Barbearia - Produtos Profissionais.
      </p>
    </footer>
  </body>
</html>
